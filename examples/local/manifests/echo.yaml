# A tiny echo Service exported across the mesh. The demo deploys this in
# cluster A, marks it with a ServiceExport, and calls it by name from cluster B
# at echo.demo.svc.clusterset.local.
#
# The Service is headless (clusterIP: None) so the exporter's real pod IPs
# propagate across the mesh and are reachable directly over the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: demo
  labels:
    app: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        # http-echo:1.0 is distroless and its entrypoint is the binary, so the
        # flags belong in args, not command.
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=hello from cluster A"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 8080
---
# The standard Kubernetes Multi-Cluster Services export. DataWerx watches this,
# publishes a broker-less EndpointExport, and every peer builds a ServiceImport.
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: echo
  namespace: demo
